[project]
name = "expense-tracker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.17.2",
    "apscheduler==3.11.2",
    "email-validator==2.3.0",
    "fastapi==0.121.1",
    "httpx==0.28.1",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.4",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.1",
    "reflex==0.8.24.post1",
    "sqlalchemy==2.0.44",
    "uvicorn==0.38.0",
]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "*/__init__.py",
    "ui_reflex/.web",
    "ui_reflex/.states"
]

target-version = "py311"
show-fixes = true

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "W",
    "SIM",
    "RSE",
    "C4"
]

ignore = [
    "B008",
    "SIM105"
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = [
    "E501"
]
"tests/conftest.py" = [
    "E402"
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "asyncio: mark test as async"
]

[dependency-groups]
dev = [
    "freezegun==1.5.5",
    "pre-commit==3.6.2",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.16.5",
]
