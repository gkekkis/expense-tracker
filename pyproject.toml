[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "*/__init__.py",
    "ui_reflex/.web",
    "ui_reflex/.states"
]

target-version = "py311"
show-fixes = true

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "N",
    "W",
    "SIM",
    "RSE",
    "C4"
]

ignore = [
    "B008",
    "SIM105"
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = [
    "E501"
]
"tests/conftest.py" = [
    "E402"
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "asyncio: mark test as async"
]
